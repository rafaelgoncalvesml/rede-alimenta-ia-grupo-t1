name: CI

on:
  push:
    branches: [main]
  pull_request:

# so le o repo; nenhum job precisa de segredo (os testes rodam sempre em memoria)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: ruff e pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 3.12 e a versao da imagem Docker (api/Dockerfile)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check .
      # python -m: so assim a raiz do repo entra no sys.path e o conftest acha o pacote api
      - run: python -m pytest api ml -q

  sast:
    name: Bandit e pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      # qualquer achado derruba o job; o relatorio sobe como artefato mesmo assim
      - name: Bandit
        run: bandit -r api ml infra -x api/tests,ml/tests -f txt -o bandit.txt
      - name: Bandit, relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit
          path: bandit.txt
          if-no-files-found: ignore
      - name: pip-audit nas dependencias da API
        run: pip-audit -r api/requirements.txt

  imagem:
    name: Docker build e Trivy
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t rede-alimenta-api:ci -f api/Dockerfile .
      # --ignore-unfixed porque os HIGH que sobram na Debian 13 ainda nao tem correcao publicada
      # (docs/security/trivy-imagem.md). Sem a flag o gate ficaria vermelho sem ter o que corrigir
      - name: Trivy na imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rede-alimenta-api:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy no Dockerfile
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: api
          severity: HIGH,CRITICAL
          exit-code: "1"
      # a imagem sobe com STORAGE em memoria e sem admin, so pra ver se o container responde
      - name: Container sobe e responde em /health
        run: |
          docker run -d --name api-ci -p 8000:8000 -e JWT_SECRET=ci-so-pra-health-check-0123456789abcdef rede-alimenta-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api-ci
          exit 1
