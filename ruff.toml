line-length = 100
extend-exclude = [".venv"]

[lint]
# pyflakes + erros do pycodestyle, bugbear e ordem de imports. E741 fica de fora
# porque o `l` de "lote" em comprehension nao esconde bug nenhum.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["E741"]

[lint.flake8-bugbear]
# Depends() em argumento padrao e o jeito do FastAPI, nao o bug que o B008 procura
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBearer"]
