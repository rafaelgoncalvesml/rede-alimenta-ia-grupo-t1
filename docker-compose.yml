# Sobe a API com um comando:  docker compose up --build
#   API: http://localhost:8000  (Swagger em /docs)
#
# Sem .env a API roda com STORAGE=memory (os dados somem ao reiniciar) e sem JWT_SECRET ela nao
# sobe: copie .env.example para .env e preencha JWT_SECRET (32+ caracteres). Pro Supabase, preencha
# tambem SUPABASE_DB_URL e rode com STORAGE=postgres.
# O .env fica fora do Git e fora da imagem: so entra no container como variavel de ambiente.
#
# O frontend (Streamlit) ja tem app/Dockerfile, mas o servico abaixo segue comentado: a imagem so foi
# construida no CI (job "Imagem do app"), ninguem subiu os dois juntos por aqui. Antes de ligar,
# troque API_URL por REDE_ALIMENTA_API_URL, que e o nome que o app le.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE: ${STORAGE:-memory}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

