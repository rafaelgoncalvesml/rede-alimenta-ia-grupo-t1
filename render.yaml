services:
  - type: web
    name: rede-alimenta-ia-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    # o Supabase esta em us-east-2 (Ohio); a mesma regiao corta a latencia de cada consulta
    region: ohio
    healthCheckPath: /health
    # deploy manual pelo painel do Render. O CI (.github/workflows/ci.yml) roda Bandit e Trivy, mas nao publica
    autoDeployTrigger: "off"
    envVars:
      # o Dockerfile sobe o uvicorn na 8000; sem isto o Render espera a 10000
      - key: PORT
        value: "8000"
      # em memoria a API sobe sem erro e perde tudo a cada deploy
      - key: STORAGE
        value: postgres
      - key: TOKEN_MINUTOS
        value: "30"
      - key: MAX_BODY_BYTES
        value: "65536"
      - key: KG_POR_REFEICAO
        value: "0.5"
      # o Render fica atras do Cloudflare, que sobrescreve o CF-Connecting-IP: so aqui ele vale
      # como IP do cliente pro limite de pedidos (docs/deploy-render.md). Nunca ligar fora do Render
      - key: CONFIAR_CF_CONNECTING_IP
        value: "1"
      # segredos: o Render gera ou pergunta na criacao do blueprint, nunca ficam no repo
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
